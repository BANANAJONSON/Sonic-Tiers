<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We've Moved!</title>

    <!-- Auto Redirect -->
    <meta http-equiv="refresh" content="5; url=https://sonictiers-264233862910.europe-west2.run.app/" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Segoe UI, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, #4f46e5 0%, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4 0%, transparent 35%),
                #0f172a;
            color: white;
        }

        .bg-blur {
            position: absolute;
            width: 600px;
            height: 600px;
            background: #4f46e5;
            filter: blur(180px);
            opacity: 0.25;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite;
        }

        .bg-blur.two {
            background: #06b6d4;
            right: -100px;
            bottom: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .card {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 50px;
            border-radius: 28px;
            backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(79,70,229,0.25);
            border: 1px solid rgba(79,70,229,0.4);
            margin-bottom: 20px;
            font-size: 14px;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .countdown {
            margin-top: 30px;
            font-size: 3rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            padding: 15px 30px;
            border-radius: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .url {
            margin-top: 18px;
            color: #94a3b8;
            font-size: 0.9rem;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>
    <div class="bg-blur two"></div>

    <div class="card">
        <div class="badge">🚀 Website Updated</div>

        <h1>We've Moved!</h1>

        <p>
            SonicTiers has been updated and moved to a new website.
            You will be redirected automatically in a few seconds.
        </p>

        <div class="countdown" id="countdown">5</div>

        <a class="btn" href="https://sonictiers-264233862910.europe-west2.run.app/">
            Go Now
        </a>

        <div class="url">
            https://sonictiers-264233862910.europe-west2.run.app/
        </div>
    </div>

    <script>
        let seconds = 5;
        const countdown = document.getElementById("countdown");

        const timer = setInterval(() => {
            seconds--;
            countdown.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href =
                    "https://sonictiers-264233862910.europe-west2.run.app/";
            }
        }, 1000);
    </script>

</body>
</html>
